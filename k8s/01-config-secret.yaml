apiVersion: v1
kind: ConfigMap
metadata:
  name: mediconnect-config
  namespace: mediconnect
data:
  DATABASE_HOST: "mysql-db"
  DATABASE_PORT: "3306"
  DATABASE_NAME: "mediconnect_db"
  REDIS_HOST: "redis-cache"
  REDIS_PORT: "6379"
  DOCTOR_SERVICE_HOST: "doctor-service"
  DOCTOR_SERVICE_PORT: "8081"
  NODE_ENV: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: mediconnect-secrets
  namespace: mediconnect
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "rootpassword"
  DATABASE_USERNAME: "root"
  DATABASE_PASSWORD: "rootpassword"
  GEMINI_API_KEY: ""
