apiVersion: v1
kind: Service
metadata:
  name: doctor-service
  namespace: mediconnect
  labels:
    app: doctor-service
spec:
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app: doctor-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service-deployment
  namespace: mediconnect
  labels:
    app: doctor-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql-db 3306; do echo waiting for mysql-db; sleep 3; done"]
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis-cache 6379; do echo waiting for redis-cache; sleep 2; done"]
      containers:
        - name: doctor-service
          image: DOCKER_REGISTRY/doctor-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: mediconnect-config
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mediconnect-secrets
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mediconnect-secrets
                  key: DATABASE_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 20
            failureThreshold: 3
