services:
  mysql-db:
    profiles: ["docker-db"]
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: mediconnect-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-123456}
      MYSQL_DATABASE: ${DATABASE_NAME:-mediconnect_db}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mediconnect-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  redis-cache:
    image: redis:7.2-alpine
    container_name: mediconnect-redis
    ports:
      - "6379:6379"
    networks:
      - mediconnect-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  doctor-service:
    build:
      context: ./backend/doctor-service
      dockerfile: Dockerfile
    container_name: doctor-service
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-host.docker.internal}
      - DATABASE_PORT=${DATABASE_PORT:-3306}
      - DATABASE_NAME=${DATABASE_NAME:-mediconnect_db}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-root}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-123456}
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    depends_on:
      redis-cache:
        condition: service_healthy
    networks:
      - mediconnect-network

  appointment-service:
    build:
      context: ./backend/appointment-service
      dockerfile: Dockerfile
    container_name: appointment-service
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-host.docker.internal}
      - DATABASE_PORT=${DATABASE_PORT:-3306}
      - DATABASE_NAME=${DATABASE_NAME:-mediconnect_db}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-root}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-123456}
      - DOCTOR_SERVICE_HOST=doctor-service
      - DOCTOR_SERVICE_PORT=8081
    depends_on:
      doctor-service:
        condition: service_started
    networks:
      - mediconnect-network

  frontend-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediconnect-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - mediconnect-network

  gateway-service:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: mediconnect-gateway
    ports:
      - "8080:80"
    depends_on:
      - doctor-service
      - appointment-service
      - frontend-service
    networks:
      - mediconnect-network

volumes:
  mysql-data:

networks:
  mediconnect-network:
    driver: bridge
