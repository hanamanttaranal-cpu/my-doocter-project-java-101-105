server.port=8082

# Database Configuration (MySQL - defaults to local MySQL; configurable via Docker/EKS env vars)
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:mediconnect_db}?sslMode=${DATABASE_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:123456}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Service Communication URL
service.doctor.url=http://${DOCTOR_SERVICE_HOST:localhost}:${DOCTOR_SERVICE_PORT:8081}

# Kubernetes / AWS EKS Actuator Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
